<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f5c50" />
    <title>需要联网｜西浦非官方指南</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f7f3ea;
        color: #263c34;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid #d9d2c3;
        border-radius: 20px;
        background: #fffaf0;
        padding: 28px;
        box-sizing: border-box;
        box-shadow: 0 16px 48px rgb(31 44 37 / 9%);
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #1f5c50;
        color: #fff9ed;
        font-size: 22px;
      }
      h1 {
        margin: 20px 0 0;
        font:
          700 28px/1.25 ui-serif,
          'Songti SC',
          serif;
      }
      p {
        margin: 12px 0 0;
        color: #66736c;
        font-size: 15px;
        line-height: 1.75;
      }
      a {
        min-height: 48px;
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        padding: 0 20px;
        background: #1f5c50;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">书</div>
      <h1>需要联网获取最新答案</h1>
      <p>
        为了避免显示过期校园信息，本指南不会离线保存答案。连接网络后再试一次。
      </p>
      <a href="/">重新连接</a>
    </main>
  </body>
</html>
