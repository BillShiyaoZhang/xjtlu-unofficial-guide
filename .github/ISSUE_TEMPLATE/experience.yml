name: 分享个人经验或不同经历
description: 分享亲历经验，也欢迎补充与手册或他人不同的经历。
title: "[个人经验] "
body:
  - type: markdown
    attributes:
      value: |
        不同经历可以同时保留。请说明发生时间和具体场景，帮助读者判断适用条件；个人经历无需提供官方链接。Issue 被收录或关闭不等于已经完成事实核验。
  - type: textarea
    id: content
    attributes:
      label: 你的经历
      description: 当时是什么场景、你怎样处理、结果如何？如果与手册或其他经历不同，请指出差异。
      placeholder: 用自己的话描述经过，并注明哪些是亲历、哪些是听说或推测。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 经历来源或补充依据
      description: 亲历可写“本人经历”；引用他人经验时请说明公开出处。有相关公开链接也可补充。
      placeholder: 本人经历，场景已在正文说明；或公开经验帖的链接与时间。
    validations:
      required: true
  - type: dropdown
    id: campus
    attributes:
      label: 经历涉及的校区
      multiple: true
      options:
        - 苏州工业园区校区
        - 太仓校区
        - 不限校区
        - 尚不确定
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: 可能适用的人群
      placeholder: 例如某学年本科新生、特定课程学生；仅适用于自己的情况也可以注明。
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 经历发生的时间
      placeholder: 例如 2026 年 9 月或某学期；记不清确切日期可填大致时间。
    validations:
      required: true
  - type: input
    id: ai
    attributes:
      label: AI 参与说明
      description: 可以使用 AI，请说明参与了哪些部分，并区分亲历内容与 AI 补充。
      placeholder: 未使用；或仅用 AI 整理语言、翻译；哪些内容由 AI 补充。
    validations:
      required: true
  - type: input
    id: article
    attributes:
      label: 关联文章（选填）
      description: 从手册文章进入时会自动带入；没有关联文章可以留空。
    validations:
      required: false
  - type: input
    id: revision
    attributes:
      label: 阅读版本（选填）
      description: 如已自动填入，请保留原样。
    validations:
      required: false
  - type: input
    id: context
    attributes:
      label: 页面场景（选填）
      description: 标记从手册哪里进入；未自动带入时可以留空。
    validations:
      required: false
  - type: checkboxes
    id: public_submission
    attributes:
      label: 公开提交确认
      options:
        - label: 我知道此 Issue 及附件会公开，确认未包含个人资料、账号密码或非公开内部材料。
          required: true
