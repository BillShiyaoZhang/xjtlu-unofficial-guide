name: 补充新资料
description: 分享手册尚未收录的入口、流程、资源或变化。
title: "[新资料] "
body:
  - type: markdown
    attributes:
      value: |
        写清资料内容、来源和适用时间即可；仍不确定的地方可以直接注明。Issue 被收录或关闭不等于已经完成事实核验。
  - type: textarea
    id: content
    attributes:
      label: 信息正文
      description: 这条信息能帮助读者做什么？请写出主要内容和已知限制。
      placeholder: 例如新的办事入口、流程变化、可用资源，以及目前仍待确认的部分。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 来源或依据
      description: 请贴公开链接或说明资料出处；个人经历可写明场景，不必寻找官方链接。
      placeholder: 公开页面链接、公开文件名称，或亲历事情的场景与信息获取方式。
    validations:
      required: true
  - type: dropdown
    id: campus
    attributes:
      label: 适用校区
      multiple: true
      options:
        - 苏州工业园区校区
        - 太仓校区
        - 不限校区
        - 尚不确定
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: 适用人群
      placeholder: 例如本科新生、在校本科生、研究生；不确定也可以注明。
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 发生或有效时间
      placeholder: 例如 2026 年 9 月、2026–2027 学年、截至某日；大致时间也可以。
    validations:
      required: true
  - type: input
    id: ai
    attributes:
      label: AI 参与说明
      description: 可以使用 AI，请说明参与了哪些部分。
      placeholder: 未使用；或用于搜索、翻译、整理、改写正文等。
    validations:
      required: true
  - type: input
    id: article
    attributes:
      label: 关联文章（选填）
      description: 从手册文章进入时会自动带入；没有关联文章可以留空。
    validations:
      required: false
  - type: input
    id: revision
    attributes:
      label: 阅读版本（选填）
      description: 如已自动填入，请保留原样。
    validations:
      required: false
  - type: input
    id: context
    attributes:
      label: 页面场景（选填）
      description: 标记从手册哪里进入；未自动带入时可以留空。
    validations:
      required: false
  - type: checkboxes
    id: public_submission
    attributes:
      label: 公开提交确认
      options:
        - label: 我知道此 Issue 及附件会公开，确认未包含个人资料、账号密码或非公开内部材料。
          required: true
