name: Public Guide Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Install fixed platform packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test business and migration boundaries
        run: npm test
      - name: Verify platform contracts
        run: npm run test:platform
      - name: Build server UI
        run: npm run build
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pages-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify public reader on the project subpath
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/pages-browser/node_modules/playwright/package.json
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:pages-browser
      - name: Build fresh public snapshot after browser fixtures
        run: npm run build:pages
      - name: Upload only the public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: community/pages-dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy public guide
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
